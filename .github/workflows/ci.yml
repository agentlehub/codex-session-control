name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    name: native-contract (${{ matrix.machine }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: X86-64
            actionlint_arch: amd64
            actionlint_sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          - runner: ubuntu-24.04-arm
            machine: AArch64
            actionlint_arch: arm64
            actionlint_sha256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils jq shellcheck

      - name: Install verified actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_${{ matrix.actionlint_arch }}.tar.gz"
          destination="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir "$destination"
          curl --fail --location --connect-timeout 10 --max-time 60 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_${{ matrix.actionlint_arch }}.tar.gz
          printf '%s  %s\n' \
            "${{ matrix.actionlint_sha256 }}" \
            "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$destination" actionlint
          "$destination/actionlint" -version | grep -x '1\.7\.12'
          printf '%s\n' "$destination" >> "$GITHUB_PATH"

      - name: Run canonical repository gate
        run: ./scripts/check.sh
