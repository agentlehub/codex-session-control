name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish
        required: true
        type: string
      candidate_sha:
        description: Exact release candidate commit
        required: true
        type: string
      source_run_id:
        description: Successful Release workflow run containing the bundle
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      run_attempt: ${{ steps.bind.outputs.run_attempt }}
      artifact_id: ${{ steps.bind.outputs.artifact_id }}
      artifact_digest: ${{ steps.bind.outputs.artifact_digest }}
    steps:
      - name: Bind the immutable source evidence
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ inputs.tag }}
          candidate_sha: ${{ inputs.candidate_sha }}
          source_run_id: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]

          run_json="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id"
          )"
          jq -e \
            --arg candidate_sha "$candidate_sha" \
            --arg tag "$tag" \
            '
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .head_sha == $candidate_sha and
              .head_branch == $tag and
              .path == ".github/workflows/release.yml" and
              (.run_attempt | type == "number" and . >= 1 and floor == .)
            ' <<<"$run_json" >/dev/null
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]

          actual_jobs="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/attempts/$run_attempt/jobs?per_page=100" \
              --jq '.jobs[] | [.name, .status, (.conclusion // "")] | join(" ")' |
              LC_ALL=C sort
          )"
          expected_jobs="$(printf '%s\n' \
            'assemble completed success' \
            'build-arm64 completed success' \
            'build-x86 completed success' \
            'validate completed success')"
          test "$actual_jobs" = "$expected_jobs"

          artifact_name="release-bundle-$candidate_sha"
          matching_artifacts="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" \
              --jq '.artifacts[]' |
              jq --slurp --arg artifact_name "$artifact_name" \
                '[.[] | select(.name == $artifact_name)]'
          )"
          test "$(jq 'length' <<<"$matching_artifacts")" -eq 1
          artifact_json="$(jq '.[0]' <<<"$matching_artifacts")"
          jq -e \
            --arg artifact_name "$artifact_name" \
            --arg candidate_sha "$candidate_sha" \
            --arg source_run_id "$source_run_id" \
            '
              .name == $artifact_name and
              (.id | type == "number" and . > 0 and floor == .) and
              (.digest | type == "string" and length > 0) and
              .expired == false and
              (.workflow_run.id | tostring) == $source_run_id and
              .workflow_run.head_sha == $candidate_sha
            ' <<<"$artifact_json" >/dev/null
          artifact_id="$(jq -r '.id' <<<"$artifact_json")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact_json")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          {
            echo "run_attempt=$run_attempt"
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the tag to peel to the candidate
        shell: bash
        env:
          tag: ${{ inputs.tag }}
          candidate_sha: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          git fetch --no-tags origin "refs/tags/$tag"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$candidate_sha"

      - name: Download the bound source-run bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.bind.outputs.artifact_id }}
          path: release
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Validate the exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' entry; do
            test -f "$entry"
            test ! -L "$entry"
          done < <(find release -mindepth 1 -maxdepth 1 -print0)

          actual="$(find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf '%s\n' \
            SHA256SUMS \
            codex-session-control-aarch64-unknown-linux-gnu \
            codex-session-control-x86_64-unknown-linux-gnu \
            install.sh)"
          test "$actual" = "$expected"

          chmod 0755 \
            release/codex-session-control-aarch64-unknown-linux-gnu \
            release/codex-session-control-x86_64-unknown-linux-gnu
          chmod 0644 release/SHA256SUMS release/install.sh
          (cd release && sha256sum --check SHA256SUMS)

          cargo test --test cli_contract --locked -- --list |
            grep -q '^release_assets: test$'
          CODEX_SESSION_CONTROL_RELEASE_DIR="$PWD/release" \
            cargo test --test cli_contract release_assets --locked -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/release-assets.log"
          grep -q 'validated release bundle:' "$RUNNER_TEMP/release-assets.log"
          ! grep -q 'skipped release bundle:' "$RUNNER_TEMP/release-assets.log"

      - name: Prove the release does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_response="$RUNNER_TEMP/release-response"
          set +e
          gh api --method GET --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            >"$release_response"
          release_status=$?
          set -e
          test "$release_status" -ne 0
          grep -Eq \
            '^HTTP/[^[:space:]]+[[:space:]]+404([[:space:]]|$)' \
            "$release_response"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Revalidate the immutable source evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/local/bin:/usr/bin:/bin
          tag: ${{ inputs.tag }}
          candidate_sha: ${{ inputs.candidate_sha }}
          source_run_id: ${{ inputs.source_run_id }}
          run_attempt: ${{ needs.verify.outputs.run_attempt }}
          artifact_id: ${{ needs.verify.outputs.artifact_id }}
          artifact_digest: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          run_json="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id"
          )"
          jq -e \
            --arg candidate_sha "$candidate_sha" \
            --arg tag "$tag" \
            '
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .head_sha == $candidate_sha and
              .head_branch == $tag and
              .path == ".github/workflows/release.yml" and
              (.run_attempt | type == "number" and . >= 1 and floor == .)
            ' <<<"$run_json" >/dev/null
          current_run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          test "$current_run_attempt" = "$run_attempt"

          actual_jobs="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/attempts/$run_attempt/jobs?per_page=100" \
              --jq '.jobs[] | [.name, .status, (.conclusion // "")] | join(" ")' |
              LC_ALL=C sort
          )"
          expected_jobs="$(printf '%s\n' \
            'assemble completed success' \
            'build-arm64 completed success' \
            'build-x86 completed success' \
            'validate completed success')"
          test "$actual_jobs" = "$expected_jobs"

          artifact_name="release-bundle-$candidate_sha"
          matching_artifacts="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" \
              --jq '.artifacts[]' |
              jq --slurp --arg artifact_name "$artifact_name" \
                '[.[] | select(.name == $artifact_name)]'
          )"
          test "$(jq 'length' <<<"$matching_artifacts")" -eq 1
          test "$(jq -r '.[0].id' <<<"$matching_artifacts")" = "$artifact_id"
          test "$(jq -r '.[0].digest' <<<"$matching_artifacts")" = "$artifact_digest"

          artifact_json="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          )"
          jq -e \
            --arg artifact_id "$artifact_id" \
            --arg artifact_name "$artifact_name" \
            --arg artifact_digest "$artifact_digest" \
            --arg candidate_sha "$candidate_sha" \
            --arg source_run_id "$source_run_id" \
            '
              (.id | tostring) == $artifact_id and
              .name == $artifact_name and
              .digest == $artifact_digest and
              (.digest | type == "string" and length > 0) and
              .expired == false and
              (.workflow_run.id | tostring) == $source_run_id and
              .workflow_run.head_sha == $candidate_sha
            ' <<<"$artifact_json" >/dev/null

      - name: Reverify the tag target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/local/bin:/usr/bin:/bin
          tag: ${{ inputs.tag }}
          candidate_sha: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          tag_json="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          )"
          tag_type="$(jq -r '.object.type' <<<"$tag_json")"
          tag_object="$(jq -r '.object.sha' <<<"$tag_json")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]

          for ((depth = 0; depth < 16; depth++)); do
            if [ "$tag_type" = commit ]; then
              break
            fi
            test "$tag_type" = tag
            tag_json="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/git/tags/$tag_object"
            )"
            tag_type="$(jq -r '.object.type' <<<"$tag_json")"
            tag_object="$(jq -r '.object.sha' <<<"$tag_json")"
            [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$tag_type" = commit
          tag_commit="$tag_object"
          test "$tag_commit" = "$candidate_sha"

      - name: Download the bound source-run bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Requery the bound artifact after download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/local/bin:/usr/bin:/bin
          candidate_sha: ${{ inputs.candidate_sha }}
          source_run_id: ${{ inputs.source_run_id }}
          artifact_id: ${{ needs.verify.outputs.artifact_id }}
          artifact_digest: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          artifact_name="release-bundle-$candidate_sha"
          matching_artifacts="$(
            gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" \
              --jq '.artifacts[]' |
              jq --slurp --arg artifact_name "$artifact_name" \
                '[.[] | select(.name == $artifact_name)]'
          )"
          test "$(jq 'length' <<<"$matching_artifacts")" -eq 1
          test "$(jq -r '.[0].id' <<<"$matching_artifacts")" = "$artifact_id"
          test "$(jq -r '.[0].digest' <<<"$matching_artifacts")" = "$artifact_digest"

          artifact_json="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          )"
          jq -e \
            --arg artifact_id "$artifact_id" \
            --arg artifact_name "$artifact_name" \
            --arg artifact_digest "$artifact_digest" \
            --arg candidate_sha "$candidate_sha" \
            --arg source_run_id "$source_run_id" \
            '
              (.id | tostring) == $artifact_id and
              .name == $artifact_name and
              .digest == $artifact_digest and
              (.digest | type == "string" and length > 0) and
              .expired == false and
              (.workflow_run.id | tostring) == $source_run_id and
              .workflow_run.head_sha == $candidate_sha
            ' <<<"$artifact_json" >/dev/null

      - name: Validate the bundle without executing candidate code
        shell: bash
        env:
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          test -d "$release_dir"
          while IFS= read -r -d '' entry; do
            test -f "$entry"
            test ! -L "$entry"
          done < <(/usr/bin/find "$release_dir" -mindepth 1 -maxdepth 1 -print0)

          actual="$(
            /usr/bin/find "$release_dir" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              /usr/bin/sort
          )"
          expected="$(printf '%s\n' \
            SHA256SUMS \
            codex-session-control-aarch64-unknown-linux-gnu \
            codex-session-control-x86_64-unknown-linux-gnu \
            install.sh)"
          test "$actual" = "$expected"

          /usr/bin/chmod 0755 \
            "$release_dir/codex-session-control-aarch64-unknown-linux-gnu" \
            "$release_dir/codex-session-control-x86_64-unknown-linux-gnu"
          /usr/bin/chmod 0644 \
            "$release_dir/SHA256SUMS" \
            "$release_dir/install.sh"
          test "$(/usr/bin/stat --format '%a' \
            "$release_dir/codex-session-control-aarch64-unknown-linux-gnu")" = 755
          test "$(/usr/bin/stat --format '%a' \
            "$release_dir/codex-session-control-x86_64-unknown-linux-gnu")" = 755
          test "$(/usr/bin/stat --format '%a' "$release_dir/SHA256SUMS")" = 644
          test "$(/usr/bin/stat --format '%a' "$release_dir/install.sh")" = 644

          test "$(/usr/bin/wc --lines < "$release_dir/SHA256SUMS")" -eq 2
          /usr/bin/sed -n '1p' "$release_dir/SHA256SUMS" |
            /usr/bin/grep -Eq \
              '^[0-9a-f]{64}  codex-session-control-aarch64-unknown-linux-gnu$'
          /usr/bin/sed -n '2p' "$release_dir/SHA256SUMS" |
            /usr/bin/grep -Eq \
              '^[0-9a-f]{64}  codex-session-control-x86_64-unknown-linux-gnu$'
          (
            cd "$release_dir"
            /usr/bin/sha256sum --check SHA256SUMS
          )

          /usr/bin/file \
            "$release_dir/codex-session-control-x86_64-unknown-linux-gnu" |
            /usr/bin/grep -E 'ELF 64-bit.*x86-64'
          /usr/bin/readelf --file-header \
            "$release_dir/codex-session-control-x86_64-unknown-linux-gnu" |
            /usr/bin/grep -E 'Machine:.*Advanced Micro Devices X86-64'
          /usr/bin/file \
            "$release_dir/codex-session-control-aarch64-unknown-linux-gnu" |
            /usr/bin/grep -E 'ELF 64-bit.*(ARM aarch64|aarch64)'
          /usr/bin/readelf --file-header \
            "$release_dir/codex-session-control-aarch64-unknown-linux-gnu" |
            /usr/bin/grep -E 'Machine:.*AArch64'

      - name: Prove the release still does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/local/bin:/usr/bin:/bin
          tag: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_response="$RUNNER_TEMP/release-response"
          set +e
          gh api --method GET --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            >"$release_response"
          release_status=$?
          set -e
          test "$release_status" -ne 0
          /usr/bin/grep -Eq \
            '^HTTP/[^[:space:]]+[[:space:]]+404([[:space:]]|$)' \
            "$release_response"

      - name: Publish the verified release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/local/bin:/usr/bin:/bin
          tag: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$tag" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/codex-session-control-aarch64-unknown-linux-gnu" \
            "$RUNNER_TEMP/release/codex-session-control-x86_64-unknown-linux-gnu" \
            "$RUNNER_TEMP/release/install.sh" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes
