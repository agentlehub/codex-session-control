name: Bug report
description: Report a reproducible problem in Codex Session Control.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the [private security advisory form](https://github.com/agentlehub/codex-session-control/security/advisories/new).
  - type: dropdown
    id: host_surface
    attributes:
      label: Host surface
      options:
        - Codex Desktop
        - Codex CLI
        - Generic stdio MCP host
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version and visibility
      description: Report the manifest version and whether the plugin is enabled and visible in this host.
    validations:
      required: true
  - type: textarea
    id: desktop_socket
    attributes:
      label: Desktop shared-socket availability
      description: Report whether the private shared socket exists. Do not paste its full path or environment values.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact stderr or MCP error
      description: Paste the exact error after redacting paths, credentials, environment values, and task content.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the shortest sequence of steps that reproduces the problem. Remove secrets and private task data.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant output
      description: Redact credentials, private paths, environment values, and task content.
    validations:
      required: true
