[package]
name = "codex-session-control"
version = "0.3.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Control Codex sessions via MCP"
repository = "https://github.com/agentlehub/codex-session-control"

[[bin]]
name = "codex-session-control"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "schemars", "transport-io"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-std", "time", "process", "fs", "test-util"] }
tokio-tungstenite = "0.30"
toml = "1.1.3"
uzers = "0.12.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
